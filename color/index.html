<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comic Book Coloring Portfolio – Jason Wilson</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <h1>Jason Wilson</h1>
      <p><a href="mailto:jasonbwilson.story@gmail.com">jasonbwilson.story@gmail.com</a></p>
    </div>
  </header>

  <!-- Main Gallery -->
  <main>
    <div id="gallery" class="gallery-grid">
      <!-- JavaScript will populate this -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Jason Wilson. All rights reserved.</p>
  </footer>

  <!-- Shadowbox Modal -->
  <div id="shadowbox" class="shadowbox hidden">
    <div class="shadowbox-content">
      <span class="close-button" id="closeShadowbox">&times;</span>
      <img id="shadowboxImage" src="" alt="Full-size comic image" />
      <div id="shadowboxCredits" class="shadowbox-credits"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="credits.js"></script>
  <script src="main.js"></script>
</body>
</html>
